<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Joyal Lasrado Creative Profile</title>
<desc id="d">Minimal animated editorial banner</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0067FF"/><stop offset="1" stop-color="#00A7C4"/>
  </linearGradient>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}
    .mono{font-family:"Courier New",monospace}
    .name{font-size:82px;font-weight:800;letter-spacing:-4px;fill:#0D1117}
    .eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;fill:#0067FF}
    .sub{font-size:20px;fill:#4B5563}
    .small{font-size:13px;letter-spacing:1.5px;fill:#6B7280}
    .line{animation:grow 5s ease-in-out infinite;transform-origin:180px 257px}
    .r1{animation:r1 12s ease-in-out infinite}
    .r2{animation:r2 12s ease-in-out infinite}
    .r3{animation:r3 12s ease-in-out infinite}
    .dot{animation:pulse 1.8s ease-in-out infinite}
    @keyframes grow{0%,100%{transform:scaleX(.12)}50%{transform:scaleX(1)}}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes r1{0%,27%{opacity:1}33%,94%{opacity:0}100%{opacity:1}}
    @keyframes r2{0%,27%{opacity:0}33%,60%{opacity:1}66%,100%{opacity:0}}
    @keyframes r3{0%,60%{opacity:0}66%,94%{opacity:1}100%{opacity:0}}
  </style>
</defs>

<rect width="1200" height="360" rx="28" fill="#FFFFFF"/>
<rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#E5E7EB"/>

<text x="70" y="62" class="sans eyebrow">CREATIVE PROFILE / 2026</text>

<text x="66" y="160" class="sans name">JOYAL LASRADO</text>

<g class="sans sub">
  <text x="72" y="214" class="r1">Visual Storyteller · Photographer · Videographer</text>
  <text x="72" y="214" class="r2">Video Editor · Graphic Designer · Creative Technologist</text>
  <text x="72" y="214" class="r3">Web Creator · Digital Designer · Visual Problem Solver</text>
</g>

<rect x="72" y="254" width="690" height="4" rx="2" fill="#E5E7EB"/>
<rect x="72" y="254" width="690" height="4" rx="2" fill="url(#accent)" class="line"/>

<text x="72" y="302" class="mono small">PHOTOGRAPHY  /  MOTION  /  DESIGN  /  WEB</text>

<circle cx="1090" cy="57" r="5" fill="#00A7C4" class="dot"/>
<text x="1110" y="62" class="mono small">AVAILABLE</text>

<text x="920" y="309" class="mono small">MONSTER316</text>
</svg>