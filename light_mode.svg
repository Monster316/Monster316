<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0">
    <stop stop-color="#34D5FF"/>
    <stop offset=".55" stop-color="#77F2BD"/>
    <stop offset="1" stop-color="#FF8A4C"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#F7F8FA"/>
    <stop offset=".72" stop-color="#F3F5F7"/>
    <stop offset="1" stop-color="#EDF1F5"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:Consolas,Courier New,monospace}
    .eyebrow{font-size:13px;letter-spacing:4px;fill:#667085}
    .first,.last{font-size:86px;font-weight:800;letter-spacing:-4px;fill:#111827}
    .role{font-size:20px;font-weight:700;letter-spacing:2px;fill:#77F2BD}
    .meta{font-size:14px;fill:#667085}
    .stackTitle{font-size:12px;letter-spacing:3px;fill:#34D5FF}
    .skillNo{font-size:11px;letter-spacing:1px;fill:#34D5FF}
    .skillTitle{font-size:18px;font-weight:700;letter-spacing:.4px;fill:#1F2937}
    .skillSub{font-size:10px;letter-spacing:.6px;fill:#667085}
    .status{font-size:12px;letter-spacing:2px;fill:#34D5FF}
    .bar{animation:bar 6s ease-in-out infinite;transform-origin:left center}
    .blink{animation:blink 1.4s steps(1) infinite}
    .r1{animation:r1 12s infinite}.r2{animation:r2 12s infinite}.r3{animation:r3 12s infinite}.r4{animation:r4 12s infinite}
    .a1{animation:a1 12s infinite}.a2{animation:a2 12s infinite}.a3{animation:a3 12s infinite}.a4{animation:a4 12s infinite}.a5{animation:a5 12s infinite}
    .p1{animation:p1 12s infinite;transform-origin:left center}.p2{animation:p2 12s infinite;transform-origin:left center}.p3{animation:p3 12s infinite;transform-origin:left center}.p4{animation:p4 12s infinite;transform-origin:left center}.p5{animation:p5 12s infinite;transform-origin:left center}
    @keyframes bar{0%,100%{transform:scaleX(.18)}50%{transform:scaleX(1)}}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.2}}
    @keyframes r1{0%,20%{opacity:1}25%,100%{opacity:0}}
    @keyframes r2{0%,24%{opacity:0}25%,45%{opacity:1}50%,100%{opacity:0}}
    @keyframes r3{0%,49%{opacity:0}50%,70%{opacity:1}75%,100%{opacity:0}}
    @keyframes r4{0%,74%{opacity:0}75%,95%{opacity:1}100%{opacity:0}}
    @keyframes a1{0%,18%{opacity:1}20%,100%{opacity:.38}}
    @keyframes a2{0%,19%{opacity:.38}20%,38%{opacity:1}40%,100%{opacity:.38}}
    @keyframes a3{0%,39%{opacity:.38}40%,58%{opacity:1}60%,100%{opacity:.38}}
    @keyframes a4{0%,59%{opacity:.38}60%,78%{opacity:1}80%,100%{opacity:.38}}
    @keyframes a5{0%,79%{opacity:.38}80%,98%{opacity:1}100%{opacity:.38}}
    @keyframes p1{0%,18%{transform:scaleX(1)}20%,100%{transform:scaleX(.22)}}
    @keyframes p2{0%,19%{transform:scaleX(.22)}20%,38%{transform:scaleX(1)}40%,100%{transform:scaleX(.22)}}
    @keyframes p3{0%,39%{transform:scaleX(.22)}40%,58%{transform:scaleX(1)}60%,100%{transform:scaleX(.22)}}
    @keyframes p4{0%,59%{transform:scaleX(.22)}60%,78%{transform:scaleX(1)}80%,100%{transform:scaleX(.22)}}
    @keyframes p5{0%,79%{transform:scaleX(.22)}80%,98%{transform:scaleX(1)}100%{transform:scaleX(.22)}}
  </style>
</defs>

<rect width="1200" height="360" fill="url(#fade)"/>

<g opacity=".14" stroke="#CBD5E1">
  <line x1="42" y1="64" x2="1158" y2="64"/>
  <line x1="42" y1="304" x2="1158" y2="304"/>
  <line x1="790" y1="64" x2="790" y2="304"/>
</g>

<circle cx="1040" cy="95" r="150" fill="#34D5FF" opacity=".07" filter="url(#glow)"/>
<circle cx="960" cy="310" r="120" fill="#FF8A4C" opacity=".045" filter="url(#glow)"/>

<text x="48" y="45" class="mono eyebrow">MONSTER316 / CREATIVE PROFILE</text>
<text x="48" y="147" class="sans first">JOYAL</text>
<text x="48" y="232" class="sans last">LASRADO</text>

<g class="sans role">
  <text x="53" y="275" class="r1">VISUAL STORYTELLER</text>
  <text x="53" y="275" class="r2">VIDEO EDITOR</text>
  <text x="53" y="275" class="r3">GRAPHIC DESIGNER</text>
  <text x="53" y="275" class="r4">WEB CREATOR</text>
</g>

<rect x="48" y="291" width="540" height="3" rx="2" fill="url(#accent)" class="bar"/>

<!-- premium creative stack -->
<text x="835" y="92" class="mono stackTitle">CREATIVE STACK</text>

<g class="a1">
  <text x="835" y="128" class="mono skillNo">01</text>
  <text x="875" y="128" class="sans skillTitle">PHOTOGRAPHY</text>
  <text x="875" y="145" class="mono skillSub">PORTRAIT / EVENT / PRODUCT</text>
  <rect x="875" y="154" width="245" height="3" rx="2" fill="#D8E1E8"/>
  <rect x="875" y="154" width="245" height="3" rx="2" fill="#34D5FF" class="p1"/>
</g>

<g class="a2">
  <text x="835" y="174" class="mono skillNo">02</text>
  <text x="875" y="174" class="sans skillTitle">VIDEOGRAPHY</text>
  <text x="875" y="191" class="mono skillSub">EVENT / REELS / COVERAGE</text>
  <rect x="875" y="200" width="245" height="3" rx="2" fill="#D8E1E8"/>
  <rect x="875" y="200" width="245" height="3" rx="2" fill="#77F2BD" class="p2"/>
</g>

<g class="a3">
  <text x="835" y="220" class="mono skillNo">03</text>
  <text x="875" y="220" class="sans skillTitle">VIDEO EDITING</text>
  <text x="875" y="237" class="mono skillSub">STORY / PACE / POST</text>
  <rect x="875" y="246" width="245" height="3" rx="2" fill="#D8E1E8"/>
  <rect x="875" y="246" width="245" height="3" rx="2" fill="#FF8A4C" class="p3"/>
</g>

<g class="a4">
  <text x="835" y="266" class="mono skillNo">04</text>
  <text x="875" y="266" class="sans skillTitle">GRAPHIC DESIGN</text>
  <text x="875" y="283" class="mono skillSub">BRAND / SOCIAL / CAMPAIGN</text>
  <rect x="875" y="292" width="245" height="3" rx="2" fill="#D8E1E8"/>
  <rect x="875" y="292" width="245" height="3" rx="2" fill="#34D5FF" class="p4"/>
</g>

<g class="a5">
  <text x="835" y="312" class="mono skillNo">05</text>
  <text x="875" y="312" class="sans skillTitle">WEB / DIGITAL</text>
  <text x="875" y="329" class="mono skillSub">WORDPRESS / WEB / SYSTEMS</text>
</g>

<circle cx="1008" cy="345" r="4" fill="#34D5FF" class="blink"/>
<text x="1024" y="350" class="mono status">AVAILABLE / ONLINE</text>

<text x="48" y="332" class="mono meta">KARKALA · KARNATAKA · INDIA</text>
</svg>