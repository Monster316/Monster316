<rect x="485" y="238" width="560" height="9" rx="5" fill="#77F2BD" class="b2"/>
<text x="1060" y="248" class="mono pct">90%</text>

<!-- 3 -->
<text x="64" y="306" class="sans skill">VIDEO EDITING</text>
