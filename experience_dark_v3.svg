<rect x="485" y="298" width="560" height="9" rx="5" fill="#FF8A4C" class="b3"/>
<text x="1060" y="308" class="mono pct">92%</text>

<!-- 4 -->
<text x="64" y="366" class="sans skill">GRAPHIC DESIGN</text>
<text x="64" y="387" class="mono sub">BRANDING · POSTERS · THUMBNAILS · CAMPAIGNS</text>
<rect x="485" y="358" width="560" height="9" rx="5" fill="#1D2C3D"/>
<rect x="485" y="358" width="560" height="9" rx="5" fill="#34D5FF" class="b4"/>
<text x="1060" y="368" class="mono pct">89%</text>

<!-- 5 -->
<text x="64" y="426" class="sans skill">WEB DEVELOPMENT</text>
<text x="64" y="447" class="mono sub">WORDPRESS · HTML/CSS · PORTFOLIOS · DIGITAL EXPERIENCES</text>
<rect x="485" y="418" width="560" height="9" rx="5" fill="#1D2C3D"/>
<rect x="485" y="418" width="560" height="9" rx="5" fill="#77F2BD" class="b5"/>
<text x="1060" y="428" class="mono pct">78%</text>

<!-- 6 -->
<text x="64" y="486" class="sans skill">CREATIVE DIRECTION</text>
<text x="64" y="507" class="mono sub">CONCEPT · VISUAL SYSTEM · PRESENTATION · EXECUTION</text>
<rect x="485" y="478" width="560" height="9" rx="5" fill="#1D2C3D"/>
<rect x="485" y="478" width="560" height="9" rx="5" fill="#FF8A4C" class="b6"/>
<text x="1060" y="488" class="mono pct">84%</text>

<circle cx="1095" cy="70" r="4" fill="#34D5FF" class="pulse"/>
<text x="1110" y="74" class="mono sub">ACTIVE</text>
</svg>