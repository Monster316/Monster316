<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Joyal OS Creative Terminal</title><desc id="desc">Animated ASCII GitHub profile header for Joyal Lasrado</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="620"><stop stop-color="#0284C7"/><stop offset="1" stop-color="#059669"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#0F172A" opacity=".03"/></pattern>
<style>
.m{font-family:"Courier New",Consolas,monospace}.t{font-size:17px;fill:#0F172A}.s{font-size:14px;fill:#475569}.a{fill:#0284C7}.g{fill:#059669}.w{fill:#B45309}.ascii{font-size:22px;font-weight:700;fill:#0F172A;filter:url(#glow)}
.p{animation:p 4.6s ease-in-out infinite}.c{animation:b 1s steps(1) infinite}.scan{animation:s 7s linear infinite}.gl{animation:g 8s steps(1) infinite}
.l1{opacity:0;animation:f .45s forwards .35s}.l2{opacity:0;animation:f .45s forwards .7s}.l3{opacity:0;animation:f .45s forwards 1.05s}.l4{opacity:0;animation:f .45s forwards 1.4s}.l5{opacity:0;animation:f .45s forwards 1.75s}.l6{opacity:0;animation:f .45s forwards 2.1s}
.ba{animation:ba 4.2s ease-out infinite;transform-origin:0 0}.bb{animation:bb 4.8s ease-out infinite;transform-origin:0 0}.bc{animation:bc 5.2s ease-out infinite;transform-origin:0 0}
@keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes p{0%,100%{opacity:.96}50%{opacity:.68}}@keyframes f{to{opacity:1}}
@keyframes s{from{transform:translateY(-560px)}to{transform:translateY(560px)}}@keyframes g{0%,94%,100%{transform:translate(0)}95%{transform:translate(2px,-1px)}96%{transform:translate(-2px,1px)}97%{transform:translate(1px,0)}}
@keyframes ba{0%{transform:scaleX(.1)}42%,100%{transform:scaleX(1)}}@keyframes bb{0%{transform:scaleX(.08)}48%,100%{transform:scaleX(.96)}}@keyframes bc{0%{transform:scaleX(.12)}52%,100%{transform:scaleX(.99)}}
</style></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/><rect x="34" y="30" width="1132" height="552" rx="22" fill="#FFFFFF" stroke="url(#stroke)" stroke-width="2.5" class="p"/>
<rect x="34" y="30" width="1132" height="38" rx="22" fill="#E8EEF5"/><circle cx="68" cy="49" r="6" fill="#FB7185"/><circle cx="91" cy="49" r="6" fill="#FBBF24"/><circle cx="114" cy="49" r="6" fill="#059669"/>
