<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="360"><stop stop-color="#050816"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#7C3AED"/><stop offset="1" stop-color="#F97316"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .ui{font-family:"Courier New",monospace}.display{font-family:Arial,sans-serif;font-weight:900}
    .role{font:700 22px Arial,sans-serif;fill:#86EFAC;letter-spacing:2px}
    .r1{animation:r1 10s infinite}.r2{animation:r2 10s infinite}.r3{animation:r3 10s infinite}.r4{animation:r4 10s infinite}.r5{animation:r5 10s infinite}
    .scan{animation:scan 5s linear infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}.dash{stroke-dasharray:8 14;animation:dash 8s linear infinite}
    @keyframes scan{from{transform:translateX(-280px)}to{transform:translateX(920px)}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-220}}
    @keyframes r1{0%,16%{opacity:1;transform:translateY(0)}20%,100%{opacity:0;transform:translateY(-6px)}}
    @keyframes r2{0%,18%{opacity:0}20%,36%{opacity:1}40%,100%{opacity:0}}
    @keyframes r3{0%,38%{opacity:0}40%,56%{opacity:1}60%,100%{opacity:0}}
    @keyframes r4{0%,58%{opacity:0}60%,76%{opacity:1}80%,100%{opacity:0}}
    @keyframes r5{0%,78%{opacity:0}80%,96%{opacity:1}100%{opacity:0}}
  </style>
</defs>
<rect width="900" height="360" rx="28" fill="url(#bg)"/>
<g opacity=".18"><path d="M0 70H900M0 140H900M0 210H900M0 280H900" stroke="#5B7288"/><path d="M130 0V360M260 0V360M390 0V360M520 0V360M650 0V360M780 0V360" stroke="#5B7288"/></g>
<rect x="34" y="28" width="832" height="304" rx="24" fill="none" stroke="#20344B"/>
<rect x="54" y="48" width="10" height="10" rx="5" fill="#22D3EE" class="pulse"/><text x="77" y="58" class="ui" font-size="13" fill="#7DD3FC">MONSTER316 / CREATIVE PROFILE</text>
<text x="56" y="148" class="display" font-size="74" fill="#F8FAFC">JOYAL</text>
<text x="56" y="216" class="display" font-size="74" fill="url(#accent)">LASRADO</text>
<line x1="58" y1="238" x2="810" y2="238" stroke="url(#accent)" stroke-width="3"/>
<g transform="translate(58 274)">
 <text class="role r1">VISUAL STORYTELLER</text><text class="role r2">VIDEO EDITOR</text><text class="role r3">GRAPHIC DESIGNER</text><text class="role r4">WEB CREATOR</text><text class="role r5">PHOTOGRAPHER</text>
</g>
<text x="58" y="312" class="ui" font-size="14" fill="#94A3B8">CREATE • DESIGN • EDIT • BUILD</text>
<path d="M600 95 C680 45, 795 70, 835 145 C870 212, 820 280, 735 286" fill="none" stroke="url(#accent)" stroke-width="2" class="dash"/>
<circle cx="737" cy="286" r="7" fill="#F97316" filter="url(#glow)" class="pulse"/>
<rect x="-250" y="74" width="220" height="2" fill="#22D3EE" opacity=".5" class="scan"/>
</svg>