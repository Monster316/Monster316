<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0">
    <stop stop-color="#34D5FF"/>
    <stop offset=".55" stop-color="#77F2BD"/>
    <stop offset="1" stop-color="#FF8A4C"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#05070C"/>
    <stop offset=".72" stop-color="#080D16"/>
    <stop offset="1" stop-color="#0A1220"/>
  </linearGradient>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:Consolas,Courier New,monospace}
    .eyebrow{font-size:13px;letter-spacing:4px;fill:#8FA1B5}
    .first,.last{font-size:86px;font-weight:800;letter-spacing:-4px;fill:#F5F7FA}
    .role{font-size:20px;font-weight:700;letter-spacing:2px;fill:#77F2BD}
    .meta{font-size:14px;fill:#96A8BA}
    .stackTitle{font-size:12px;letter-spacing:3px;fill:#34D5FF}
    .skillNo{font-size:11px;letter-spacing:1px;fill:#34D5FF}
    .skillTitle{font-size:16px;font-weight:700;letter-spacing:.4px;fill:#EAF4FB}
    .skillSub{font-size:9px;letter-spacing:.5px;fill:#8EA3B7}
    .status{font-size:11px;letter-spacing:1.5px;fill:#34D5FF}
    .bar{animation:bar 6s ease-in-out infinite;transform-origin:left center}
    .blink{animation:blink 1.4s steps(1) infinite}
    .r1{animation:r1 12s infinite}.r2{animation:r2 12s infinite}.r3{animation:r3 12s infinite}.r4{animation:r4 12s infinite}
    .a1{animation:a1 12s infinite}.a2{animation:a2 12s infinite}.a3{animation:a3 12s infinite}.a4{animation:a4 12s infinite}.a5{animation:a5 12s infinite}
    @keyframes bar{0%,100%{transform:scaleX(.18)}50%{transform:scaleX(1)}}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.2}}
    @keyframes r1{0%,20%{opacity:1}25%,100%{opacity:0}}
    @keyframes r2{0%,24%{opacity:0}25%,45%{opacity:1}50%,100%{opacity:0}}
    @keyframes r3{0%,49%{opacity:0}50%,70%{opacity:1}75%,100%{opacity:0}}
    @keyframes r4{0%,74%{opacity:0}75%,95%{opacity:1}100%{opacity:0}}
    @keyframes a1{0%,18%{opacity:1}20%,100%{opacity:.4}}
    @keyframes a2{0%,19%{opacity:.4}20%,38%{opacity:1}40%,100%{opacity:.4}}
    @keyframes a3{0%,39%{opacity:.4}40%,58%{opacity:1}60%,100%{opacity:.4}}
    @keyframes a4{0%,59%{opacity:.4}60%,78%{opacity:1}80%,100%{opacity:.4}}
    @keyframes a5{0%,79%{opacity:.4}80%,98%{opacity:1}100%{opacity:.4}}
  </style>
</defs>

<rect width="1200" height="360" fill="url(#fade)"/>

<g opacity=".14" stroke="#334155">
  <line x1="42" y1="64" x2="1158" y2="64"/>
  <line x1="42" y1="304" x2="1158" y2="304"/>
  <line x1="790" y1="64" x2="790" y2="304"/>
</g>

<circle cx="1040" cy="95" r="150" fill="#34D5FF" opacity=".045"/>
<circle cx="960" cy="310" r="120" fill="#FF8A4C" opacity=".03"/>

<text x="48" y="45" class="mono eyebrow">MONSTER316 / CREATIVE PROFILE</text>
<text x="48" y="147" class="sans first">JOYAL</text>
<text x="48" y="232" class="sans last">LASRADO</text>

<g class="sans role">
  <text x="53" y="275" class="r1">VISUAL STORYTELLER</text>
  <text x="53" y="275" class="r2">VIDEO EDITOR</text>
  <text x="53" y="275" class="r3">GRAPHIC DESIGNER</text>
  <text x="53" y="275" class="r4">WEB CREATOR</text>
</g>

<rect x="48" y="291" width="540" height="3" rx="2" fill="url(#accent)" class="bar"/>

<!-- corrected creative stack panel -->
<rect x="810" y="72" width="340" height="258" rx="18" fill="#0D1623" opacity=".58" stroke="#26384B" stroke-width="1"/>
<text x="835" y="95" class="mono stackTitle">CREATIVE STACK</text>

<g class="a1">
  <text x="835" y="122" class="mono skillNo">01</text>
  <text x="875" y="122" class="sans skillTitle">PHOTOGRAPHY</text>
  <text x="875" y="137" class="mono skillSub">PORTRAIT / EVENT / PRODUCT</text>
</g>

<g class="a2">
  <text x="835" y="162" class="mono skillNo">02</text>
  <text x="875" y="162" class="sans skillTitle">VIDEOGRAPHY</text>
  <text x="875" y="177" class="mono skillSub">EVENT / REELS / COVERAGE</text>
</g>

<g class="a3">
  <text x="835" y="202" class="mono skillNo">03</text>
  <text x="875" y="202" class="sans skillTitle">VIDEO EDITING</text>
  <text x="875" y="217" class="mono skillSub">STORY / PACE / POST</text>
</g>

<g class="a4">
  <text x="835" y="242" class="mono skillNo">04</text>
  <text x="875" y="242" class="sans skillTitle">GRAPHIC DESIGN</text>
  <text x="875" y="257" class="mono skillSub">BRAND / SOCIAL / CAMPAIGN</text>
</g>

<g class="a5">
  <text x="835" y="282" class="mono skillNo">05</text>
  <text x="875" y="282" class="sans skillTitle">WEB / DIGITAL</text>
  <text x="875" y="297" class="mono skillSub">WORDPRESS / WEB / SYSTEMS</text>
</g>

<line x1="835" y1="310" x2="1125" y2="310" stroke="#26384B" stroke-width="1"/>
<circle cx="842" cy="319" r="4" fill="#34D5FF" class="blink"/>
<text x="858" y="323" class="mono status">AVAILABLE / ONLINE</text>

<text x="48" y="332" class="mono meta">KARKALA · KARNATAKA · INDIA</text>
</svg>